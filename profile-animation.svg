<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190" role="img" aria-labelledby="title desc">
  <title id="title">Ankitaa Panpatil animated coding illustration</title>
  <desc id="desc">A colorful laptop with floating stars, leaves, and a gentle animated glow.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fed7aa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="640" height="190" rx="20" fill="url(#background)"/>
  <circle cx="88" cy="50" r="28" fill="#f59e0b" opacity=".18">
    <animate attributeName="r" values="24;34;24" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="552" cy="142" r="34" fill="#fb7185" opacity=".16">
    <animate attributeName="r" values="30;40;30" dur="4s" repeatCount="indefinite"/>
  </circle>
  <g fill="#fde68a" filter="url(#glow)">
    <path d="M120 34l4 10 10 4-10 4-4 10-4-10-10-4 10-4z">
      <animateTransform attributeName="transform" type="rotate" from="0 120 46" to="360 120 46" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M510 38l3 8 8 3-8 3-3 8-3-8-8-3 8-3z">
      <animate attributeName="opacity" values=".3;1;.3" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="none" stroke="#99f6e4" stroke-width="3" stroke-linecap="round" opacity=".8">
    <path d="M151 137c-18-28-4-48 19-58">
      <animate attributeName="stroke-dasharray" values="0 90;90 0;0 90" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M489 135c17-25 9-45-13-57">
      <animate attributeName="stroke-dasharray" values="0 90;90 0;0 90" dur="4s" begin="1s" repeatCount="indefinite"/>
    </path>
  </g>
  <g transform="translate(220 28)">
    <rect x="0" y="0" width="200" height="112" rx="10" fill="#082f49" stroke="#99f6e4" stroke-width="4"/>
    <rect x="12" y="12" width="176" height="88" rx="5" fill="url(#screen)"/>
    <circle cx="26" cy="25" r="4" fill="#fb7185"/>
    <circle cx="40" cy="25" r="4" fill="#f59e0b"/>
    <circle cx="54" cy="25" r="4" fill="#14b8a6"/>
    <path d="M38 51l20 14-20 14M78 79h30" fill="none" stroke="#0f766e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="stroke-width" values="7;9;7" dur="2.5s" repeatCount="indefinite"/>
    </path>
    <path d="M-24 119h248l-25 18H1z" fill="#99f6e4"/>
    <path d="M58 119h84l-8 8H66z" fill="#0f766e"/>
  </g>
  <g fill="#fb7185">
    <path d="M176 112c-17-26-39-18-35 4 4 18 31 24 35 24 4 0 31-6 35-24 4-22-18-30-35-4z">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>